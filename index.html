    :root { color-scheme: light; --bg:#f1f1ef; --panel:#101010; --line:#d2d2cf; --muted:#777; --white:#f2f2f0; --mono:'DM Mono',monospace; --sans:'Manrope',sans-serif; }

<body>
  <div class="shell">
    <main>
      <div class="section-top"><span>Agent chats <span id="count">00</span></span><div class="section-top-right"><div class="filters" id="filters" aria-label="Filter projects"></div><button type="button" class="add" id="addProjectBtn">+ Select folder</button></div></div>
      <div class="imported-row" id="importedRow" hidden></div>
      <div class="board-empty" id="boardEmpty" hidden></div>
      <section class="board" id="board" aria-label="Agent board">
        <div class="col" data-state="Working">
          <div class="col-head"><span class="label"><i class="col-dot"></i>Working</span><span class="col-count" id="countWorking">0</span></div>
          <div class="col-body" id="colWorking"></div>
        </div>
        <div class="col" data-state="Done">
          <div class="col-head"><span class="label"><i class="col-dot"></i>Completed</span><span class="col-count" id="countDone">0</span></div>
          <div class="col-body" id="colDone"></div>
        </div>
      </section>
      <div class="bottom-note"><span id="workspaceNote">LOCAL CONVERSATIONS · 0 PROJECTS</span><span>HOVER TO INSPECT &nbsp; / &nbsp; CLICK TO CONTINUE</span></div>
    </main>
  </div>
  <div class="detail-layer" id="detailLayer"></div>
  <script>
    let agents = [];
    let importedProjects=[];
    const colWorking=document.querySelector('#colWorking'), colDone=document.querySelector('#colDone');
    const detailLayer=document.querySelector('#detailLayer'), filters=document.querySelector('#filters');
    let selectedProjects=null; let knownProjects=new Set(); let showAllCompleted=false; const filesCache={}; const chatCache={}; const stableAgentOrder=new Map();
    const windows=new Map(); let zCounter=10;
    const MIC_SVG='<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 18v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M8.5 21h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    async function fetchProjects(){
      const previous=importedProjects.join('\0');
      try{const res=await fetch('/api/projects');importedProjects=await res.json()}catch(e){importedProjects=[]}
      if(importedProjects.join('\0')!==previous){selectedProjects=null;knownProjects=new Set()}
      renderImportedRow();
    }
    function renderImportedRow(){

    function inlineMd(s){
      let out=escapeHtml(s);
      out=out.replace(/`([^`]+)`/g,'<code>$1</code>');
      out=out.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
      out=out.replace(/(^|[^*])\*([^*]+)\*([^*]|$)/g,'$1<em>$2</em>$3');

    function renderTextBlock(text){
      const lines=text.split('\n');
      let html='', listBuf=[], listType=null;
      function flushList(){
        if(!listBuf.length) return;
        const tag=listType==='ol'?'ol':'ul';
        html+=`<${tag} class="md-list">${listBuf.map(li=>`<li>${inlineMd(li)}</li>`).join('')}</${tag}>`;
        listBuf=[]; listType=null;
      }
      for(const line of lines){
        const heading=/^(#{1,4})\s+(.*)$/.exec(line);
        const bullet=/^[-*]\s+(.*)$/.exec(line);
        const numbered=/^\d+\.\s+(.*)$/.exec(line);
        if(heading){ flushList(); html+=`<div class="md-heading">${inlineMd(heading[2])}</div>`; continue }
        if(bullet){ if(listType!=='ul'){flushList(); listType='ul'} listBuf.push(bullet[1]); continue }
        if(numbered){ if(listType!=='ol'){flushList(); listType='ol'} listBuf.push(numbered[1]); continue }
        if(line.trim()===''){ flushList(); continue }
        flushList();
        html+=`<div class="md-line">${inlineMd(line)}</div>`;
      }
      flushList();
      return html;
    }
    function renderMarkdownLite(text){
      const codeRe=/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g;
      let html='', lastIndex=0, m;
      while((m=codeRe.exec(text))){
        if(m.index>lastIndex) html+=renderTextBlock(text.slice(lastIndex,m.index));
        html+=`<pre class="md-code"><code>${escapeHtml(m[2].replace(/\n$/,''))}</code></pre>`;
        lastIndex=codeRe.lastIndex;
      }
      if(lastIndex<text.length) html+=renderTextBlock(text.slice(lastIndex));
      return html;
    }

    function formatBytes(bytes){

      return `${size.toFixed(size>=100?0:1)} ${units[index]}`;
    }

        <form class="reprompt"><textarea placeholder="Give this agent a new instruction… (paste an image to attach it)" aria-label="New instruction"></textarea><button type="button" class="mic" aria-label="Dictate" title="Dictate">${MIC_SVG}</button><button class="send">Send ↗</button></form>
        <div class="resize-e"></div>
        <div class="resize-s"></div>
        <div class="resize-se"></div>
      `;
    }
    function renderImageChips(win){
      const row=win.el.querySelector('.img-chips');
      row.hidden=win.pendingImages.length===0;
      row.innerHTML=win.pendingImages.map((img,i)=>`<div class="img-chip"><img src="${img.dataUrl}" alt=""><button type="button" class="chip-x" data-idx="${i}" aria-label="Remove image">×</button></div>`).join('');
      row.querySelectorAll('.chip-x').forEach(btn=>btn.addEventListener('click',()=>{
        win.pendingImages.splice(Number(btn.dataset.idx),1);
        renderImageChips(win);
      }));
    }
    function addPastedImage(win,file){
      const reader=new FileReader();
      reader.onload=()=>{win.pendingImages.push({mimeType:file.type,dataUrl:reader.result});renderImageChips(win)};
      reader.readAsDataURL(file);
    }
    function wireWindow(win){
      win.el.addEventListener('mousedown',()=>bringToFront(win));
      makeDraggable(win);
      makeResizable(win);
      win.el.querySelector('.close').addEventListener('click',()=>closeWindow(win.id));
      win.el.querySelectorAll('.view-tabs .tab').forEach(btn=>btn.addEventListener('click',()=>{
        win.currentView=btn.dataset.view;
        win.el.querySelectorAll('.view-tabs .tab').forEach(b=>{const active=b===btn;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});
        const chatView=win.el.querySelector('.detail-chat'), detailsView=win.el.querySelector('.detail-details'), filesView=win.el.querySelector('.detail-files');
        chatView.hidden=win.currentView!=='chat'; detailsView.hidden=win.currentView!=='details'; filesView.hidden=win.currentView!=='files';
        win.el.classList.toggle('chat-mode',win.currentView==='chat');
        win.el.classList.toggle('details-mode',win.currentView==='details');
        if(win.currentView==='files') loadFiles(win);
        if(win.currentView==='chat') loadChat(win);
        if(win.currentView==='details') renderDetails(win);
      }));
      win.el.querySelector('.mode-select').addEventListener('change',async e=>{
        const mode=e.target.value;
        try{
          await fetch(`/api/agents/${encodeURIComponent(win.id)}/mode`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode})});
        }catch(err){}
        fetchAgents();
      });
      win.el.querySelector('.approval-banner .approve').addEventListener('click',()=>decideApproval(win.el.querySelector('.approval-banner').dataset.approvalId,'allow'));
      win.el.querySelector('.approval-banner .deny').addEventListener('click',()=>decideApproval(win.el.querySelector('.approval-banner').dataset.approvalId,'deny'));
      win.el.querySelector('.reprompt').addEventListener('submit',async e=>{
        e.preventDefault();
        const box=win.el.querySelector('textarea'),msg=box.value.trim();
        const images=win.pendingImages;
        if(!msg&&images.length===0)return;
        const id=win.id, sendBtn=win.el.querySelector('.send');
        box.value=''; sendBtn.disabled=true;
        win.pendingImages=[]; renderImageChips(win);
        const cache=chatCache[id]||{messages:[]};
        cache.messages=cache.messages.concat([{role:'user',text:msg+(images.length?` 📎${images.length} image${images.length>1?'s':''}`:'')}]);
        chatCache[id]=cache;
        if(win.currentView==='chat') renderChat(win,cache);
        try{
          const payload={message:msg,images:images.map(img=>({mimeType:img.mimeType,data:img.dataUrl.split(',')[1]}))};
          const res=await fetch(`/api/agents/${encodeURIComponent(id)}/send`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          const data=await res.json();
          if(!data.ok) throw new Error(data.error||'Could not queue follow-up');
          if(!data.runId) throw new Error('The running dashboard server is outdated. Restart server.js.');
          const statusPanel=win.el.querySelector('.send-status');
          const showStatus=text=>{statusPanel.hidden=false;statusPanel.textContent=text};
          showStatus(data.queued?'Queued; waiting for the previous prompt.':'Starting provider…');
          void (async()=>{
            let failures=0;
            while(windows.has(id)){
              await new Promise(resolve=>setTimeout(resolve,1000));
              try{
                const response=await fetch(`/api/sends/${encodeURIComponent(data.runId)}`,{cache:'no-store'});
                if(!response.ok) {showStatus('Send status unavailable. The server may have restarted; check the transcript before sending again.');return}
                const status=await response.json();failures=0;
                if(status.status==='completed'||status.status==='failed'){
                  showStatus(status.status==='completed'?[status.result.warning,status.result.output].filter(Boolean).join('\n\n'):`Follow-up failed: ${status.result?.error||'Unknown error'}`);
                  refreshChat(win);fetchAgents();return;
                }
                showStatus([status.detail,status.output].filter(Boolean).join('\n\n') || (status.status==='queued'?'Queued; waiting for the previous prompt.':'Provider is processing. File edits will pause for approval.'));
              }catch(err){if(++failures>=3){showStatus('Connection lost while waiting for the provider. Check the transcript before sending again.');return}}
            }
          })();
        }catch(err){
          cache.messages.push({role:'agent',text:`⚠ Not sent — ${err.message||'could not reach the dashboard server'}`});
        }
        if(win.currentView==='chat'&&windows.has(id)) renderChat(win,cache);
        delete filesCache[id];
        if(win.currentView==='files'&&windows.has(id)) loadFiles(win,true);
        sendBtn.disabled=false;
        fetchAgents();
      });
      win.el.querySelector('textarea').addEventListener('paste',e=>{
        const items=[...(e.clipboardData?.items||[])].filter(it=>it.kind==='file'&&it.type.startsWith('image/'));
        if(items.length===0)return;
        e.preventDefault();
        items.forEach(it=>{const file=it.getAsFile(); if(file) addPastedImage(win,file)});
      });
      const micBtn=win.el.querySelector('.mic');
      micBtn.addEventListener('click',async()=>{
        if(win.mediaRecorder&&win.mediaRecorder.state==='recording'){win.mediaRecorder.stop();return}
        let stream;
        try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
        catch(err){console.error('Mic access denied',err);return}
        win.recordedChunks=[];
        win.mediaRecorder=new MediaRecorder(stream);
        win.mediaRecorder.ondataavailable=e=>{if(e.data.size>0)win.recordedChunks.push(e.data)};
        win.mediaRecorder.onstop=async()=>{
          stream.getTracks().forEach(t=>t.stop());
          micBtn.classList.remove('recording');micBtn.classList.add('processing');micBtn.disabled=true;
          const blob=new Blob(win.recordedChunks,{type:'audio/webm'});
          try{
            const res=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':'audio/webm'},body:blob});
            const data=await res.json();
            if(data.ok&&data.text){
              const box=win.el.querySelector('textarea');
              box.value=(box.value?box.value+' ':'')+data.text;
              box.focus();
            }else console.error('Transcription failed',data.error);
          }catch(err){console.error('Transcription failed',err)}
          micBtn.classList.remove('processing');micBtn.disabled=false;
        };
        win.mediaRecorder.start();
        micBtn.classList.add('recording');
      });
    }
    function closeWindow(id){
      const win=windows.get(id); if(!win) return;
      if(win.mediaRecorder&&win.mediaRecorder.state==='recording'){try{win.mediaRecorder.stop()}catch(e){}}
      win.el.remove();
      windows.delete(id);
    }
    function openAgent(id){
      const a=byId(id); if(!a) return;
      let win=windows.get(id);
      if(win){ bringToFront(win); const box=win.el.querySelector('textarea'); if(box) box.focus(); return; }
      const el=document.createElement('div');
      el.className='detail-window chat-mode';
      el.dataset.win=id;
      el.innerHTML=windowTemplate();
      const pos=cascadePosition(windows.size);
      el.style.top=pos.top+'px'; el.style.left=pos.left+'px';
      detailLayer.appendChild(el);
      win={id, el, currentView:'chat', mediaRecorder:null, recordedChunks:[], pendingImages:[], extraLoaded:false, lastMtime:a.mtimeMs};
      windows.set(id, win);
      wireWindow(win);
      bringToFront(win);
      win.el.querySelector('.win-title').textContent=a.title+' · '+a.repo;
      delete chatCache[id]; delete filesCache[id];
      win.el.querySelector('.mode-select').value=a.mode||a.detectedMode||'manual';
      loadChat(win);
      updateApprovalBanner(win);
      setTimeout(()=>{const box=win.el.querySelector('textarea'); if(box) box.focus()},80);
    }
    document.addEventListener('keydown',e=>{
      if(e.key!=='Escape') return;
      let top=null, topZ=-1;
      windows.forEach(w=>{const z=parseInt(w.el.style.zIndex||'0',10); if(z>topZ){topZ=z;top=w}});
      if(top) closeWindow(top.id);
    });
    async function fetchAgents(){
      try{
        const res=await fetch('/api/agents');
        agents=await res.json();
        agents.forEach(a=>{if(!stableAgentOrder.has(a.id)){const started=Date.parse(a.startedAt);stableAgentOrder.set(a.id,Number.isFinite(started)?started:a.mtimeMs)}});
        render();
        windows.forEach(win=>{if(win.currentView==='files')loadFiles(win,true)});
      }catch(e){console.error('Failed to load agents',e)}
    }
    fetchProjects().then(fetchAgents);
    setInterval(fetchAgents,1000);
  </script>
</body>
</html>
